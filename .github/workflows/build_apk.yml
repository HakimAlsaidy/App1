name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Generate Android platform folder if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.hallguard --project-name hall_guard_app _scaffold
            cp -r _scaffold/android ./android
            rm -rf _scaffold
          fi

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Force compileSdk 36 for all Android modules
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/force-compile-sdk.gradle" <<'EOF'
          allprojects { project ->
              project.afterEvaluate {
                  def android = project.extensions.findByName("android")
                  if (android != null) {
                      try {
                          android.compileSdkVersion 36
                      } catch (Exception ignored) {
                          try {
                              android.compileSdk = 36
                          } catch (Exception ignoredAgain) {
                              // Ignore projects that do not expose a compatible Android DSL.
                          }
                      }
                     }
                  }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon (hall.png)
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hall-guard-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
