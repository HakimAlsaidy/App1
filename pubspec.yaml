name: hall
description: "تطبيق كشف استلام المقررات السنوي لحارس القاعة"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Localization & Arabic support
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # UI Enhancements
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  badges: ^3.1.2

  # Utils
  shared_preferences: ^2.3.3
  share_plus: ^10.1.2
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Regular.ttf
        - asset: fonts/Cairo-Bold.ttf
          weight: 700
        - asset: fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: fonts/Cairo-Medium.ttf
          weight: 500
